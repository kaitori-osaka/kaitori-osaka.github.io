<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>管理画面｜買取大吉 大阪勝山南店</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="icon-64.png" type="image/png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap">
<link rel="stylesheet" href="site.css">
<link rel="stylesheet" href="admin.css">
<script src="config.js"></script>
<script src="api.js" defer></script>
<script src="admin.js" defer></script>
</head><body class="adm">
<header class="hd"><div class="wrap">
<a class="brand" href="admin.html"><img src="logo-h-white.png" width="165" height="40" alt="買取大吉"><span>勝山南店 管理画面</span></a>
<div class="who" id="who" hidden>
<label>操作する人 <select id="actor"></select></label>
<button class="menu-btn reload-btn" id="reload" type="button" title="最新の状況を読み込みます">↻ 更新<small id="reloadAt"></small></button>
<button class="menu-btn" id="logout" type="button">ログアウト</button>
</div>
</div></header>

<main class="wrap" id="main">
<section id="loginBox" class="login">
<h1>担当者ログイン</h1>
<form id="loginForm" class="form">
<div class="f"><label for="lid">ログインID</label><input type="text" id="lid" autocomplete="username" autocapitalize="none" spellcheck="false" required></div>
<div class="f"><label for="pw">パスワード</label><input type="password" id="pw" autocomplete="current-password" required></div>
<button class="btn blue" type="submit">ログイン</button>
<div id="loginMsg" role="alert"></div>
</form>
</section>

<section id="app" hidden>
<nav class="views" id="views" aria-label="画面の切り替え"><button type="button" data-view="cases" class="on">受付・査定</button><button type="button" data-view="customers">顧客管理</button><button type="button" data-view="products">商品管理表</button><button type="button" data-view="buyers">卸先管理帳</button><button type="button" data-view="ledger">売上台帳</button></nav>
<div id="appMsg" role="alert"></div>
<div id="vCases">
<div class="bar">
<div class="tabs" role="tablist">
<button data-tab="todo" class="on">要対応 <span class="cnt" id="cTodo"></span></button>
<button data-tab="open">進行中 <span class="cnt" id="cOpen"></span></button>
<button data-tab="all">すべて</button>
</div>
<div class="filters">
<select id="fKind" aria-label="方法で絞り込む"><option value="">すべての方法</option><option value="shop">店頭</option><option value="visit">出張</option><option value="photo">写真査定</option><option value="takuhai">宅配</option><option value="planA">A おまとめ（KIYOMICHI等）</option><option value="planB">B 30%UP（KIYOMICHI等）</option></select>
<input type="search" id="fq" placeholder="名前・電話・受付番号・品名" aria-label="検索">
<button class="btn ghost small" id="csv" type="button">表を書き出す</button>
</div>
</div>
<div class="split">
<div class="list" id="list"></div>
<div class="detail" id="detail"><p class="empty">左の一覧から案件を選んでください。</p></div>
</div>
</div>
<div id="vBook" hidden></div>
</section>
</main>
<div class="lightbox" id="lb" hidden><img alt="拡大した写真"><button type="button" aria-label="閉じる">×</button></div>
</body></html>
